name: lens

x-backend-build: &backend-build
  context: .
  target: backend

x-app-environment: &app-environment
  NODE_ENV: production
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
  API_PORT: 3001
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
  POSTGRES_URL: postgresql://lens:lens@postgres:5432/lens
  POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-10}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DATABASE: lens
  CLICKHOUSE_USERNAME: lens
  CLICKHOUSE_PASSWORD: lens
  CLICKHOUSE_MAX_THREADS: ${CLICKHOUSE_MAX_THREADS:-0}
  CLICKHOUSE_MAX_MEMORY_USAGE_BYTES: ${CLICKHOUSE_MAX_MEMORY_USAGE_BYTES:-0}
  CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY: ${CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY:-0}
  CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_SORT: ${CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_SORT:-0}
  REDIS_URL: redis://redis:6379
  SYSTEM_MONITOR_URL: http://monitor:3100
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-me-now}
  PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-true}
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
  OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-Company SSO}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_REQUIRE_ISSUER_VALIDATION: ${OIDC_REQUIRE_ISSUER_VALIDATION:-false}
  OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
  OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
  INGESTION_KEY_PEPPER: ${INGESTION_KEY_PEPPER:-development-ingestion-key-pepper}
  MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-120}
  INGESTION_QUEUE_MAX_WAITING: ${INGESTION_QUEUE_MAX_WAITING:-0}
  WORKER_INGEST_CONCURRENCY: ${WORKER_INGEST_CONCURRENCY:-8}
  WORKER_MATERIALIZE_CONCURRENCY: ${WORKER_MATERIALIZE_CONCURRENCY:-8}
  WORKER_EVALUATION_CONCURRENCY: ${WORKER_EVALUATION_CONCURRENCY:-8}
  MATERIALIZE_DELAY_MS: ${MATERIALIZE_DELAY_MS:-1500}
  QUEUE_RETAIN_COMPLETED_AGE_SECONDS: ${QUEUE_RETAIN_COMPLETED_AGE_SECONDS:-3600}
  QUEUE_RETAIN_COMPLETED_COUNT: ${QUEUE_RETAIN_COMPLETED_COUNT:-10000}
  QUEUE_RETAIN_FAILED_AGE_SECONDS: ${QUEUE_RETAIN_FAILED_AGE_SECONDS:-604800}
  QUEUE_RETAIN_FAILED_COUNT: ${QUEUE_RETAIN_FAILED_COUNT:-10000}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: Anvia Lens <lens@localhost>
  SMTP_SECURE: "false"

services:
  monitor:
    image: lens-backend:dev
    build: *backend-build
    command: ["node", "apps/monitor/dist/index.js"]
    environment:
      NODE_ENV: production
      SYSTEM_MONITOR_PORT: 3100
      HOST_PROC_PATH: /host/proc
      HOST_ROOT_PATH: /host/root
      HOST_DATA_PATH: /host/data
      HOST_DATA_DISPLAY_PATH: ${SYSTEM_MONITOR_DATA_PATH:-/var/lib/docker}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: ${SYSTEM_MONITOR_DATA_PATH:-/var/lib/docker}
        target: /host/data
        read_only: true
        bind:
          propagation: rslave
    networks:
      - lens-monitor
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      - lens-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - lens-redis:/data

  clickhouse:
    image: clickhouse/clickhouse-server:26.4-alpine
    environment:
      CLICKHOUSE_DB: lens
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: lens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - ${CLICKHOUSE_HTTP_PORT:-8123}:8123
      - ${CLICKHOUSE_NATIVE_PORT:-9000}:9000
    volumes:
      - lens-clickhouse:/var/lib/clickhouse

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - ${SMTP_PORT:-1025}:1025
      - ${MAILPIT_UI_PORT:-8025}:8025

  migrate:
    image: lens-backend:dev
    build: *backend-build
    command: ["node", "packages/db/dist/migrate.js"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    image: lens-backend:dev
    build: *backend-build
    environment: *app-environment
    networks:
      - default
      - lens-monitor
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - ${API_PORT:-3001}:3001

  seed:
    image: lens-backend:dev
    build: *backend-build
    profiles: ["tools"]
    command: ["node", "packages/db/dist/seed.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: lens-backend:dev
    build: *backend-build
    command: ["node", "apps/worker/dist/index.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: lens-web:dev
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${WEB_PORT:-80}:8080

volumes:
  lens-clickhouse:
  lens-postgres:
  lens-redis:

networks:
  default:
  lens-monitor:
    internal: true
