# Disposable release verification only; production defaults remain in docker-compose.yml.
services:
  postgres:
    extends: { file: docker-compose.yml, service: postgres }
  redis:
    extends: { file: docker-compose.yml, service: redis }
  clickhouse:
    extends: { file: docker-compose.yml, service: clickhouse }
  migrate:
    extends: { file: docker-compose.yml, service: migrate }
  api:
    extends: { file: docker-compose.yml, service: api }
    ports: ["127.0.0.1::3001"]
  worker:
    extends: { file: docker-compose.yml, service: worker }
  web:
    extends: { file: docker-compose.yml, service: web }
volumes:
  lens-clickhouse:
  lens-postgres:
  lens-redis:
networks:
  lens-monitor:
    internal: true
