name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Enforce web bundle budgets
        run: pnpm check:bundle

      - name: Run coverage-gated tests
        run: pnpm test:coverage

      - name: Audit production dependencies
        # The npm bulk-advisory endpoint has recurring partial outages while the
        # registry itself stays up (e.g. 2026-09-04: ~3h of timeouts on main).
        # Retry only network-class failures with backoff; genuine audit findings
        # still fail the gate immediately.
        run: |
          for attempt in 1 2 3 4 5; do
            if out=$(pnpm audit:prod 2>&1); then
              printf '%s\n' "$out"
              exit 0
            fi
            printf '%s\n' "$out"
            if ! grep -qE 'security/advisories/bulk error|aborted due to timeout' <<<"$out"; then
              exit 1
            fi
            echo "::warning::npm advisory endpoint unreachable (attempt ${attempt}/5); retrying in 3 minutes"
            if [ "$attempt" -lt 5 ]; then sleep 180; fi
          done
          exit 1

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.small.yml config >/dev/null
          docker compose --env-file .env.dev.example -f docker-compose.dev.yml config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          tags: lens-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: lens-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
