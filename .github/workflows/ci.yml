name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Enforce web bundle budgets
        run: pnpm check:bundle

      - name: Verify native SDK tracing and evaluations offline
        run: pnpm --filter @lens/example-anvia-agent test

      - name: Run coverage-gated tests
        run: pnpm test:coverage

      - name: Audit production dependencies
        # pnpm audit fails both on genuine high/critical findings and on npm's
        # bulk-advisory endpoint having outages while the registry itself stays
        # up (2026-09-04: ~3h of timeouts on main). On endpoint unavailability,
        # fall back to the OSV database (same GitHub advisory data) so the gate
        # keeps working; real findings still fail immediately.
        run: |
          if out=$(pnpm audit:prod 2>&1); then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          if ! grep -qE 'security/advisories/bulk error|aborted due to timeout' <<<"$out"; then
            exit 1
          fi
          echo "::warning::npm advisory endpoint unreachable; falling back to OSV"
          node scripts/audit-osv-fallback.mjs

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify integration and release runner cancellation
        run: node --test scripts/verify-release.test.mjs

      - name: Validate Compose files
        run: |
          docker compose --env-file .env.example config >/dev/null
          docker compose --env-file .env.example -f docker-compose.release-test.yml config >/dev/null
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.small.yml config >/dev/null
          docker compose --env-file .env.dev.example -f docker-compose.dev.yml config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: false
          load: true
          tags: lens-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: lens-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify fresh images and worker failure controls
        timeout-minutes: 10
        env:
          LENS_TEST_VERSION: ci
          LENS_TEST_BACKEND_IMAGE: lens-backend
          LENS_TEST_WEB_IMAGE: lens-web
        run: node scripts/verify-release.mjs --negative-controls
