name: Publish container images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      major_minor: ${{ steps.release.outputs.major_minor }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${REQUESTED_VERSION#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 0.2.0, received: $version" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json is $package_version but the requested release is $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            image: ghcr.io/${{ github.repository_owner }}/lens
            target: backend
          - name: Web
            image: ghcr.io/${{ github.repository_owner }}/lens-web
            target: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            LENS_VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  smoke:
    name: Smoke test published images
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify published images and failure controls
        env:
          LENS_TEST_VERSION: ${{ needs.prepare.outputs.version }}
          LENS_TEST_PULL_POLICY: always
          LENS_TEST_BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/lens
          LENS_TEST_WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/lens-web
        run: node scripts/verify-release.mjs --negative-controls

  promote:
    name: Promote ${{ matrix.name }}
    needs:
      - prepare
      - smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Backend
            image: ghcr.io/${{ github.repository_owner }}/lens
          - name: Web
            image: ghcr.io/${{ github.repository_owner }}/lens-web
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ matrix.image }}:${{ needs.prepare.outputs.major_minor }}" \
            --tag "${{ matrix.image }}:latest" \
            "${{ matrix.image }}:${{ needs.prepare.outputs.version }}"
