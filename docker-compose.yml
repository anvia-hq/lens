name: lens

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: lens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lens-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - lens-redis:/data

  clickhouse:
    image: clickhouse/clickhouse-server:26.4-alpine
    environment:
      CLICKHOUSE_DB: lens
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: lens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - lens-clickhouse:/var/lib/clickhouse

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    build:
      context: .
      target: migrate
    environment: &app-environment
      NODE_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      POSTGRES_URL: postgresql://lens:lens@postgres:5432/lens
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: lens
      CLICKHOUSE_USERNAME: lens
      CLICKHOUSE_PASSWORD: lens
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-development-only-secret-change-me-now}
      INGESTION_KEY_PEPPER: ${INGESTION_KEY_PEPPER:-development-ingestion-key-pepper}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Anvia Lens <lens@localhost>
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${API_PORT:-3001}:3001"

  seed:
    profiles: ["tools"]
    build:
      context: .
      target: seed
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  lens-clickhouse:
  lens-postgres:
  lens-redis:
